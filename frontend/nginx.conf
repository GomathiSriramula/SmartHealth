server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. The app has no server-side router (App.tsx does
    # client-side view switching via useState) but the password-reset email
    # links to a real path — /reset-password?token=...&email=... (see
    # routes/auth.js's resetUrl) — that only exists as a client-side view.
    # Without this fallback, nginx 404s that URL directly instead of
    # serving index.html and letting App.tsx's own pathname check handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite (e.g. index-Abc123.js), so
    # it's always safe to cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
